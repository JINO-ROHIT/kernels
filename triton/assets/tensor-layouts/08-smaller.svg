<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">8. A 32 x 8 tensor is copied across all four warps</text><rect x="25" y="110" width="250" height="205" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="40" y="149" font-size="24" fill="#243247">Warp 0</text><text x="40" y="200" font-size="20" fill="#243247">Full tensor: 32 x 8</text><text x="40" y="253" font-size="18" fill="#243247">lane 0:r0 = x[0,0]</text><rect x="295" y="110" width="250" height="205" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="310" y="149" font-size="24" fill="#243247">Warp 1</text><text x="310" y="200" font-size="20" fill="#243247">Full tensor: 32 x 8</text><text x="310" y="253" font-size="18" fill="#243247">lane 0:r0 = x[0,0]</text><rect x="565" y="110" width="250" height="205" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="580" y="149" font-size="24" fill="#243247">Warp 2</text><text x="580" y="200" font-size="20" fill="#243247">Full tensor: 32 x 8</text><text x="580" y="253" font-size="18" fill="#243247">lane 0:r0 = x[0,0]</text><rect x="835" y="110" width="250" height="205" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="850" y="149" font-size="24" fill="#243247">Warp 3</text><text x="850" y="200" font-size="20" fill="#243247">Full tensor: 32 x 8</text><text x="850" y="253" font-size="18" fill="#243247">lane 0:r0 = x[0,0]</text><text x="30" y="373" font-size="18" fill="#243247">Same logical tensor in each box: 256 distinct values, 4 owners for each value.</text><text x="30" y="418" font-size="18" fill="#243247">Still 8 values per thread. Replication does not create new logical tensor elements.</text></g></svg>