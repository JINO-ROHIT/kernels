<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">Count thread patches first. Then expand each patch into elements.</text><text x="30" y="97" font-size="22" fill="#243247">STEP 1: [16,2] counts THREAD PATCHES</text><rect x="30" y="120" width="92" height="57" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="146" font-size="17" fill="#243247">T0</text><rect x="125" y="120" width="92" height="57" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="134" y="146" font-size="17" fill="#243247">T1</text><rect x="30" y="180" width="92" height="57" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="39" y="206" font-size="17" fill="#243247">T2</text><rect x="125" y="180" width="92" height="57" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="134" y="206" font-size="17" fill="#243247">T3</text><rect x="30" y="240" width="92" height="57" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="39" y="266" font-size="17" fill="#243247">...</text><rect x="125" y="240" width="92" height="57" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="134" y="266" font-size="17" fill="#243247">...</text><rect x="30" y="300" width="92" height="57" rx="5" fill="#ffdeeb" stroke="#243247" stroke-width="1.5"/><text x="39" y="326" font-size="17" fill="#243247">T30</text><rect x="125" y="300" width="92" height="57" rx="5" fill="#fff3bf" stroke="#243247" stroke-width="1.5"/><text x="134" y="326" font-size="17" fill="#243247">T31</text><text x="30" y="393" font-size="18" fill="#243247">16 patch rows, 2 patch columns</text><text x="320" y="97" font-size="22" fill="#243247">STEP 2: Each thread owns [2,4] ELEMENTS</text><text x="320" y="133" font-size="18" fill="#243247">Expand the first four threads. Each cell is ONE distinct value.</text><text x="410" y="183" font-size="18" fill="#243247">0</text><text x="500" y="183" font-size="18" fill="#243247">1</text><text x="590" y="183" font-size="18" fill="#243247">2</text><text x="680" y="183" font-size="18" fill="#243247">3</text><text x="770" y="183" font-size="18" fill="#243247">4</text><text x="860" y="183" font-size="18" fill="#243247">5</text><text x="950" y="183" font-size="18" fill="#243247">6</text><text x="1040" y="183" font-size="18" fill="#243247">7</text><text x="325" y="228" font-size="18" fill="#243247">row 0</text><text x="325" y="293" font-size="18" fill="#243247">row 1</text><text x="325" y="358" font-size="18" fill="#243247">row 2</text><text x="325" y="423" font-size="18" fill="#243247">row 3</text><rect x="400" y="200" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="409" y="225" font-size="16" fill="#243247">T0:r0</text><rect x="490" y="200" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="499" y="225" font-size="16" fill="#243247">T0:r1</text><rect x="580" y="200" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="589" y="225" font-size="16" fill="#243247">T0:r2</text><rect x="670" y="200" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="679" y="225" font-size="16" fill="#243247">T0:r3</text><rect x="760" y="200" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="769" y="225" font-size="16" fill="#243247">T1:r0</text><rect x="850" y="200" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="859" y="225" font-size="16" fill="#243247">T1:r1</text><rect x="940" y="200" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="949" y="225" font-size="16" fill="#243247">T1:r2</text><rect x="1030" y="200" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="1039" y="225" font-size="16" fill="#243247">T1:r3</text><rect x="400" y="265" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="409" y="290" font-size="16" fill="#243247">T0:r4</text><rect x="490" y="265" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="499" y="290" font-size="16" fill="#243247">T0:r5</text><rect x="580" y="265" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="589" y="290" font-size="16" fill="#243247">T0:r6</text><rect x="670" y="265" width="87" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="679" y="290" font-size="16" fill="#243247">T0:r7</text><rect x="760" y="265" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="769" y="290" font-size="16" fill="#243247">T1:r4</text><rect x="850" y="265" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="859" y="290" font-size="16" fill="#243247">T1:r5</text><rect x="940" y="265" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="949" y="290" font-size="16" fill="#243247">T1:r6</text><rect x="1030" y="265" width="87" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="1039" y="290" font-size="16" fill="#243247">T1:r7</text><rect x="400" y="330" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="409" y="355" font-size="16" fill="#243247">T2:r0</text><rect x="490" y="330" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="499" y="355" font-size="16" fill="#243247">T2:r1</text><rect x="580" y="330" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="589" y="355" font-size="16" fill="#243247">T2:r2</text><rect x="670" y="330" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="679" y="355" font-size="16" fill="#243247">T2:r3</text><rect x="760" y="330" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="769" y="355" font-size="16" fill="#243247">T3:r0</text><rect x="850" y="330" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="859" y="355" font-size="16" fill="#243247">T3:r1</text><rect x="940" y="330" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="949" y="355" font-size="16" fill="#243247">T3:r2</text><rect x="1030" y="330" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="1039" y="355" font-size="16" fill="#243247">T3:r3</text><rect x="400" y="395" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="409" y="420" font-size="16" fill="#243247">T2:r4</text><rect x="490" y="395" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="499" y="420" font-size="16" fill="#243247">T2:r5</text><rect x="580" y="395" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="589" y="420" font-size="16" fill="#243247">T2:r6</text><rect x="670" y="395" width="87" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="679" y="420" font-size="16" fill="#243247">T2:r7</text><rect x="760" y="395" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="769" y="420" font-size="16" fill="#243247">T3:r4</text><rect x="850" y="395" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="859" y="420" font-size="16" fill="#243247">T3:r5</text><rect x="940" y="395" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="949" y="420" font-size="16" fill="#243247">T3:r6</text><rect x="1030" y="395" width="87" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="1039" y="420" font-size="16" fill="#243247">T3:r7</text><text x="400" y="498" font-size="18" fill="#243247">T0 and T1 sit side by side: same rows, different columns.</text><text x="400" y="533" font-size="18" fill="#243247">T2 sits below T0: next two rows, same columns.</text><rect x="30" y="570" width="1130" height="245" rx="5" fill="#fff3bf" stroke="#243247" stroke-width="1.5"/><text x="50" y="613" font-size="23" fill="#243247">STEP 3: Extend the pattern to all 32 threads</text><text x="50" y="661" font-size="21" fill="#243247">HEIGHT: 16 patch rows x 2 element rows per patch = 32 tensor rows</text><text x="50" y="701" font-size="21" fill="#243247">WIDTH:    2 patch columns x 4 element columns per patch = 8 tensor columns</text><text x="50" y="756" font-size="21" fill="#243247">32 rows x 8 columns = 256 values = 32 threads x 8 values per thread</text><text x="50" y="793" font-size="18" fill="#243247">The two 32s count different things: tensor rows on the left, threads on the right.</text></g></svg>