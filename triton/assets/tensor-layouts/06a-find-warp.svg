<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="590" viewBox="0 0 1150 590"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">Step 1: Which warp contains row 35, column 13?</text><text x="160" y="103" font-size="18" fill="#243247">columns 0-7</text><text x="420" y="103" font-size="18" fill="#243247">columns 8-15</text><text x="20" y="183" font-size="18" fill="#243247">rows 0-31</text><text x="20" y="343" font-size="18" fill="#243247">rows 32-63</text><rect x="155" y="125" width="257" height="157" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="164" y="158" font-size="24" fill="#243247">W0</text><rect x="415" y="125" width="257" height="157" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="424" y="158" font-size="24" fill="#243247">W1</text><rect x="155" y="285" width="257" height="157" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="164" y="318" font-size="24" fill="#243247">W2</text><rect x="415" y="285" width="257" height="157" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="424" y="318" font-size="24" fill="#243247">W3</text><text x="435" y="370" font-size="20" fill="#243247">x[35,13] is here</text><text x="720" y="166" font-size="21" fill="#243247">35 is between 32 and 63</text><text x="720" y="206" font-size="21" fill="#243247">=&gt; choose the BOTTOM row</text><text x="720" y="276" font-size="21" fill="#243247">13 is between 8 and 15</text><text x="720" y="316" font-size="21" fill="#243247">=&gt; choose the RIGHT column</text><text x="720" y="388" font-size="23" fill="#243247">Bottom-right = WARP 3</text><text x="30" y="500" font-size="20" fill="#243247">Why number it 3? order=[1,0] numbers across columns first: W0, W1, then W2, W3.</text><text x="30" y="550" font-size="20" fill="#243247">Warp grid coordinate [1,1] =&gt; warp ID = 1 * 2 + 1 = 3. IDs start at zero.</text></g></svg>