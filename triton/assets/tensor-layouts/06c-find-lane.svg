<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="660" viewBox="0 0 1150 660"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">Step 3: Which lane patch contains warp-local coordinate [3,5]?</text><text x="180" y="103" font-size="18" fill="#243247">local columns 0-3</text><text x="450" y="103" font-size="18" fill="#243247">local columns 4-7</text><rect x="180" y="125" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="189" y="156" font-size="22" fill="#243247">lane 0</text><rect x="450" y="125" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="459" y="156" font-size="22" fill="#243247">lane 1</text><rect x="180" y="205" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="189" y="236" font-size="22" fill="#243247">lane 2</text><rect x="450" y="205" width="267" height="77" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="459" y="236" font-size="22" fill="#243247">lane 3</text><rect x="180" y="285" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="189" y="316" font-size="22" fill="#243247">lane 4</text><rect x="450" y="285" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="459" y="316" font-size="22" fill="#243247">lane 5</text><rect x="180" y="365" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="189" y="396" font-size="22" fill="#243247">...</text><rect x="450" y="365" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="459" y="396" font-size="22" fill="#243247">...</text><rect x="180" y="445" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="189" y="476" font-size="22" fill="#243247">lane 30</text><rect x="450" y="445" width="267" height="77" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><text x="459" y="476" font-size="22" fill="#243247">lane 31</text><text x="30" y="163" font-size="18" fill="#243247">rows 0-1</text><text x="30" y="243" font-size="18" fill="#243247">rows 2-3</text><text x="30" y="323" font-size="18" fill="#243247">rows 4-5</text><text x="30" y="403" font-size="18" fill="#243247">...</text><text x="30" y="483" font-size="18" fill="#243247">rows 30-31</text><text x="750" y="162" font-size="22" fill="#243247">Each patch is 2 x 4.</text><text x="750" y="231" font-size="21" fill="#243247">Row 3 is in rows 2-3.</text><text x="750" y="276" font-size="21" fill="#243247">Column 5 is in cols 4-7.</text><text x="750" y="346" font-size="21" fill="#243247">Their intersection: lane 3</text><text x="750" y="410" font-size="20" fill="#243247">Patch row = 3 // 2 = 1</text><text x="750" y="450" font-size="20" fill="#243247">Patch col = 5 // 4 = 1</text><text x="30" y="585" font-size="20" fill="#243247">Two lane patches per row: lane ID = patch_row * 2 + patch_col = 1 * 2 + 1 = 3</text><text x="30" y="630" font-size="20" fill="#243247">Lane IDs restart at 0 inside every warp. We found lane 3 INSIDE warp 3.</text></g></svg>