<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">9. Even smaller tensors also duplicate values across lanes</text><text x="30" y="88" font-size="18" fill="#243247">Tensor 2 x 4, same layout. Within EVERY warp:</text><rect x="30" y="115" width="202" height="62" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="141" font-size="17" fill="#243247">lane 0</text><rect x="235" y="115" width="202" height="62" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="244" y="141" font-size="17" fill="#243247">lane 1</text><rect x="440" y="115" width="202" height="62" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="449" y="141" font-size="17" fill="#243247">lane 2</text><rect x="645" y="115" width="202" height="62" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="654" y="141" font-size="17" fill="#243247">...</text><rect x="850" y="115" width="202" height="62" rx="5" fill="#ffdeeb" stroke="#243247" stroke-width="1.5"/><text x="859" y="141" font-size="17" fill="#243247">lane 31</text><text x="30" y="238" font-size="18" fill="#243247">Each lane holds this SAME patch:</text><rect x="30" y="265" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="291" font-size="17" fill="#243247">x00:r0</text><rect x="175" y="265" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="184" y="291" font-size="17" fill="#243247">x01:r1</text><rect x="320" y="265" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="329" y="291" font-size="17" fill="#243247">x02:r2</text><rect x="465" y="265" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="474" y="291" font-size="17" fill="#243247">x03:r3</text><rect x="30" y="320" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="346" font-size="17" fill="#243247">x10:r4</text><rect x="175" y="320" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="184" y="346" font-size="17" fill="#243247">x11:r5</text><rect x="320" y="320" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="329" y="346" font-size="17" fill="#243247">x12:r6</text><rect x="465" y="320" width="142" height="52" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="474" y="346" font-size="17" fill="#243247">x13:r7</text><text x="660" y="283" font-size="18" fill="#243247">8 distinct elements</text><text x="660" y="328" font-size="18" fill="#243247">128 thread copies</text><text x="660" y="373" font-size="18" fill="#243247">1024 total element slots</text><text x="30" y="433" font-size="18" fill="#243247">At shape 1 x 2, even register slots duplicate: r0/r2/r4/r6 all hold x[0,0].</text></g></svg>