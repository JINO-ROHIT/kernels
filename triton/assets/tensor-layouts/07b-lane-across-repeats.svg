<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">One thread, many separated patches: warp 0 / lane 0</text><text x="30" y="86" font-size="21" fill="#243247">Each B box covers 64 rows x 16 columns. Orange marks W0 / lane 0 only.</text><text x="30" y="118" font-size="18" fill="#243247">Patch sizes are enlarged for visibility; positions and coordinate labels show the mapping.</text><text x="100" y="165" font-size="15" fill="#243247">cols 0-15</text><text x="248" y="165" font-size="15" fill="#243247">cols 16-31</text><text x="396" y="165" font-size="15" fill="#243247">cols 32-47</text><text x="544" y="165" font-size="15" fill="#243247">cols 48-63</text><text x="692" y="165" font-size="15" fill="#243247">cols 64-79</text><text x="840" y="165" font-size="15" fill="#243247">cols 80-95</text><text x="988" y="165" font-size="15" fill="#243247">cols 96-111</text><text x="1136" y="165" font-size="15" fill="#243247">cols 112-127</text><text x="15" y="291" font-size="16" fill="#243247">0-63</text><rect x="100" y="190" width="143" height="162" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><rect x="105" y="195" width="53" height="32" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="110" y="212" font-size="12" fill="#243247">W0:L0</text><text x="112" y="275" font-size="25" fill="#243247">B0</text><text x="112" y="317" font-size="17" fill="#243247">r0-r7</text><rect x="248" y="190" width="143" height="162" rx="5" fill="#f1f3f5" stroke="#243247" stroke-width="1.5"/><rect x="253" y="195" width="53" height="32" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="258" y="212" font-size="12" fill="#243247">W0:L0</text><text x="260" y="275" font-size="25" fill="#243247">B1</text><text x="260" y="317" font-size="17" fill="#243247">r8-r15</text><rect x="