ows have this ownership. Each orange box contains 2 x 4 = 8 values.</text><text x="100" y="711" font-size="16" fill="#243247">cols 0-3</text><rect x="100" y="730" width="143" height="70" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="113" y="770" font-size="20" fill="#243247">W0:L0</text><text x="248" y="711" font-size="16" fill="#243247">cols 4-7</text><rect x="248" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="261" y="770" font-size="20" fill="#243247">W0:L1</text><text x="396" y="711" font-size="16" fill="#243247">cols 8-11</text><rect x="396" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="409" y="770" font-size="20" fill="#243247">W1:L0</text><text x="544" y="711" font-size="16" fill="#243247">cols 12-15</text><rect x="544" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="557" y="770" font-size="20" fill="#243247">W1:L1</text><text x="692" y="711" font-size="16" fill="#243247">cols 16-19</text><rect x="692" y="730" width="143" height="70" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="705" y="770" font-size="20" fill="#243247">W0:L0</text><text x="840" y="711" font-size="16" fill="#243247">cols 20-23</text><rect x="840" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="853" y="770" font-size="20" fill="#243247">W0:L1</text><text x="988" y="711" font-size="16" fill="#243247">cols 24-27</text><rect x="988" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="1001" y="770" font-size="20" fill="#243247">W1:L0</text><text x="1136" y="711" font-size="16" fill="#243247">cols 28-31</text><rect x="1136" y="730" width="143" height="70" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="1149" y="770" font-size="20" fill="#243247">W1:L1</text><text x="100" y="841" font-size="21" fill="#243247">B0: columns 0-15</text><text x="692" y="841" font-size="21" fill="#243247">B1: columns 16-31</text><text x="30" y="895" font-size="20" fill="#243247">Between W0:L0 at cols 0-3 and W0:L0 at cols 16-19, cols 4-15 have other owners.</text><text x="30" y="940" font-size="20" fill="#243247">Within each box, rows 2-31 belong to other lanes; rows 32-63 belong to warps 2 and 3.</text><text x="30" y="1000" font-size="20" fill="#243247">B8 restarts at row 64: W0:L0 owns rows 64-65, cols 0-3, using slots r64-r71.</text><text x="30" y="1045" font-size="20" fill="#243247">B15: rows 64-65, cols 112-115, slots r120-r127. Total: 16 patches x 8 values = 128.</text></g></svg>