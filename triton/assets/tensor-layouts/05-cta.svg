<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">5. Four warps form the basic 64 x 16 footprint</text><text x="50" y="93" font-size="18" fill="#243247">columns 0-7</text><text x="330" y="93" font-size="18" fill="#243247">columns 8-15</text><rect x="50" y="120" width="277" height="122" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="59" y="146" font-size="17" fill="#243247">W0: lanes 0-31</text><rect x="330" y="120" width="277" height="122" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="339" y="146" font-size="17" fill="#243247">W1: lanes 0-31</text><rect x="50" y="245" width="277" height="122" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="59" y="271" font-size="17" fill="#243247">W2: lanes 0-31</text><rect x="330" y="245" width="277" height="122" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="339" y="271" font-size="17" fill="#243247">W3: lanes 0-31</text><text x="640" y="158" font-size="18" fill="#243247">Top half: rows 0-31</text><text x="640" y="283" font-size="18" fill="#243247">Bottom half: rows 32-63</text><text x="640" y="343" font-size="18" fill="#243247">Each box: 32 x 8 elements</text><text x="50" y="418" font-size="18" fill="#243247">2 x 4  *  16 x 2  *  2 x 2  =  64 x 16;  128 threads, 8 values per thread</text></g></svg>