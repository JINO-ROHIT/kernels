<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">7. A 128 x 128 tensor repeats the footprint 16 times</text><text x="30" y="93" font-size="18" fill="#243247">Each box is 64 x 16 elements; all boxes use the SAME 128 threads.</text><rect x="30" y="120" width="127" height="87" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="146" font-size="17" fill="#243247">B0</text><rect x="160" y="120" width="127" height="87" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="169" y="146" font-size="17" fill="#243247">B1</text><rect x="290" y="120" width="127" height="87" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="299" y="146" font-size="17" fill="#243247">B2</text><rect x="420" y="120" width="127" height="87" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="429" y="146" font-size="17" fill="#243247">B3</text><rect x="550" y="120" width="127" height="87" rx="5" fill="#ffdeeb" stroke="#243247" stroke-width="1.5"/><text x="559" y="146" font-size="17" fill="#243247">B4</text><rect x="680" y="120" width="127" height="87" rx="5" fill="#fff3bf" stroke="#243247" stroke-width="1.5"/><text x="689" y="146" font-size="17" fill="#243247">B5</text><rect x="810" y="120" width="127" height="87" rx="5" fill="#c3fae8" stroke="#243247" stroke-width="1.5"/><text x="819" y="146" font-size="17" fill="#243247">B6</text><rect x="940" y="120" width="127" height="87" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="949" y="146" font-size="17" fill="#243247">B7</text><rect x="30" y="210" width="127" height="87" rx="5" fill="#d0ebff" stroke="#243247" stroke-width="1.5"/><text x="39" y="236" font-size="17" fill="#243247">B8</text><rect x="160" y="210" width="127" height="87" rx="5" fill="#d3f9d8" stroke="#243247" stroke-width="1.5"/><text x="169" y="236" font-size="17" fill="#243247">B9</text><rect x="290" y="210" width="127" height="87" rx="5" fill="#ffe8cc" stroke="#243247" stroke-width="1.5"/><text x="299" y="236" font-size="17" fill="#243247">B10</text><rect x="420" y="210" width="127" height="87" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="429" y="236" font-size="17" fill="#243247">B11</text><rect x="550" y="210" width="127" height="87" rx="5" fill="#ffdeeb" stroke="#243247" stroke-width="1.5"/><text x="559" y="236" font-size="17" fill="#243247">B12</text><rect x="680" y="210" width="127" height="87" rx="5" fill="#fff3bf" stroke="#243247" stroke-width="1.5"/><text x="689" y="236" font-size="17" fill="#243247">B13</text><rect x="810" y="210" width="127" height="87" rx="5" fill="#c3fae8" stroke="#243247" stroke-width="1.5"/><text x="819" y="236" font-size="17" fill="#243247">B14</text><rect x="940" y="210" width="127" height="87" rx="5" fill="#e7f5ff" stroke="#243247" stroke-width="1.5"/><text x="949" y="236" font-size="17" fill="#243247">B15</text><text x="30" y="348" font-size="18" fill="#243247">Warp 0, lane 0 owns a 2 x 4 patch in EVERY box.</text><text x="30" y="388" font-size="18" fill="#243247">8 values per box x 16 boxes = 128 values per thread. No extra CTAs are launched.</text></g></svg>