<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="540" viewBox="0 0 1150 540"><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Comic Sans MS, Chalkboard, cursive"><text x="24" y="44" font-size="26" fill="#243247">Step 2: Zoom into warp 3 and restart the coordinates at zero</text><text x="35" y="103" font-size="23" fill="#243247">FULL TENSOR coordinates</text><rect x="35" y="130" width="470" height="240" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="55" y="173" font-size="23" fill="#243247">Warp 3 starts at [32,8]</text><text x="55" y="242" font-size="22" fill="#243247">Top-left: x[32,8]</text><text x="55" y="307" font-size="22" fill="#243247">Target:   x[35,13]</text><text x="610" y="103" font-size="23" fill="#243247">Coordinates WITHIN WARP 3</text><rect x="610" y="130" width="500" height="240" rx="5" fill="#e5dbff" stroke="#243247" stroke-width="1.5"/><text x="630" y="172" font-size="22" fill="#243247">Subtract the warp origin [32,8]</text><text x="630" y="242" font-size="22" fill="#243247">Top-left: [0,0]</text><text x="630" y="309" font-size="24" fill="#243247">Target:   [3,5]</text><text x="35" y="434" font-size="24" fill="#243247">row: 35 - 32 = 3        column: 13 - 8 = 5</text><text x="35" y="486" font-size="21" fill="#243247">Same element, different coordinate system. We have not moved the value.</text></g></svg>