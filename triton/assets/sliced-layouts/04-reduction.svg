<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="04-reduction">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243247"/></marker></defs>
<rect width="1100" height="580" fill="#fffdf7"/>
<g font-family="monospace"><text x="28" y="46" font-size="26" fill="#243247">Row reduction: combine values, then keep the row coordinate</text><text x="28" y="88" font-size="18" fill="#243247">Example: values[row, col] = 100*row + col on a full 16 x 8 tile.</text><rect x="40" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="55" y="175" font-size="20" fill="#243247">T8</text><text x="55" y="212" font-size="20" fill="#243247">100</text><rect x="170" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="185" y="175" font-size="20" fill="#243247">T9</text><text x="185" y="212" font-size="20" fill="#243247">101</text><rect x="300" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="315" y="175" font-size="20" fill="#243247">T10</text><text x="315" y="212" font-size="20" fill="#243247">102</text><rect x="430" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="445" y="175" font-size="20" fill="#243247">T11</text><text x="445" y="212" font-size="20" fill="#243247">103</text><rect x="560" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="575" y="175" font-size="20" fill="#243247">T12</text><text x="575" y="212" font-size="20" fill="#243247">104</text><rect x="690" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="705" y="175" font-size="20" fill="#243247">T13</text><text x="705" y="212" font-size="20" fill="#243247">105</text><rect x="820" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="835" y="175" font-size="20" fill="#243247">T14</text><text x="835" y="212" font-size="20" fill="#243247">106</text><rect x="950" y="140" width="120" height="90" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="965" y="175" font-size="20" fill="#243247">T15</text><text x="965" y="212" font-size="20" fill="#243247">107</text><text x="40" y="273" font-size="18" fill="#243247">Row 1: eight DIFFERENT values distributed across T8 through T15.</text><path d="M550,300 l0,55" stroke="#243247" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="200" y="380" width="700" height="65" rx="5" fill="#dcfce7" stroke="#243247" stroke-width="1.5"/><text x="210" y="421.5" font-size="22" fill="#243247">sum = 100 + 101 + ... + 107 = 828</text><text x="40" y="498" font-size="18" fill="#243247">Result: totals[1] has owners T8 | T9 | ... | T15; its value is 828.</text><text x="40" y="543" font-size="18" fill="#243247">SliceLayout describes the result ownership. gl.sum performs the addition.</text></g></svg>