<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="03-thread-trace">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243247"/></marker></defs>
<rect width="1100" height="560" fill="#fffdf7"/>
<g font-family="monospace"><text x="28" y="46" font-size="26" fill="#243247">Follow T10: slices supply its two coordinates</text><rect x="40" y="100" width="440" height="110" rx="5" fill="#dbeafe" stroke="#243247" stroke-width="1.5"/><text x="60" y="135" font-size="20" fill="#243247">rows: shape [16], row slice</text><text x="60" y="180" font-size="20" fill="#243247">T10 owns rows[1], value = 1</text><rect x="620" y="100" width="440" height="110" rx="5" fill="#ffedd5" stroke="#243247" stroke-width="1.5"/><text x="640" y="135" font-size="20" fill="#243247">cols: shape [8], column slice</text><text x="640" y="180" font-size="20" fill="#243247">T10 owns cols[2], value = 2</text><path d="M260,220 l0,65" stroke="#243247" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M840,220 l0,65" stroke="#243247" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="55" y="315" font-size="20" fill="#243247">rows[:, None]: [16, 1]</text><text x="630" y="315" font-size="20" fill="#243247">cols[None, :]: [1, 8]</text><text x="55" y="350" font-size="20" fill="#243247">Both expanded tensors use the parent layout.</text><path d="M550,370 l0,45" stroke="#243247" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="190" y="430" width="720" height="70" rx="5" fill="#dcfce7" stroke="#243247" stroke-width="1.5"/><text x="200" y="472.5" font-size="19" fill="#243247">Broadcast: T10 computes 100 * 1 + 2 = 102 at [1,2]</text></g></svg>